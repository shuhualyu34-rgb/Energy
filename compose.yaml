services:
  api:
    image: cdp1:0.40.0-dev
    build: .
    ports:
      - "127.0.0.1:${CDP_PORT:-8000}:8000"
    volumes:
      - cdp-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cdp-data:
