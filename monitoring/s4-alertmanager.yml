route:
  receiver: discard
  routes:
    - receiver: rehearsal
      matchers: ['alertname=~"CdpCollectionQualityBlocked|CdpScheduledQualityAuditWarning"']
      group_by: [alertname]
      group_wait: 0s
      group_interval: 5s
receivers:
  - name: discard
  - name: rehearsal
    webhook_configs:
      - url: http://receiver:8080/notify
        send_resolved: true
