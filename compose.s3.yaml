services:
  api:
    environment:
      CDP_S3_ENDPOINT_URL: http://objects:8333
      CDP_S3_BUCKET: cdp-archive-dev
      CDP_S3_ARCHIVE_PREFIX: cdp1
      AWS_ACCESS_KEY_ID: cdp-dev
      AWS_SECRET_ACCESS_KEY: cdp-dev-archive-only
      AWS_DEFAULT_REGION: us-east-1
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1},objects,localhost,127.0.0.1,0.0.0.0"
      no_proxy: "${NO_PROXY:-localhost,127.0.0.1},objects,localhost,127.0.0.1,0.0.0.0"
    depends_on:
      objects:
        condition: service_started
  objects:
    image: chrislusf/seaweedfs:4.17@sha256:186de7ef977a20343ee9a5544073f081976a29e2d29ecf8379891e7bf177fbe9
    environment:
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1},objects,localhost,127.0.0.1,0.0.0.0"
      no_proxy: "${NO_PROXY:-localhost,127.0.0.1},objects,localhost,127.0.0.1,0.0.0.0"
    command: ["mini", "-dir=/data", "-ip=objects", "-admin.ui=false", "-s3.config=/etc/seaweedfs/cdp-s3.json"]
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs-s3.dev.json:/etc/seaweedfs/cdp-s3.json:ro

volumes:
  s3-data:
